[project]
name = "immune-cell-classification"
version = "1.0.0"
description = "Immune-cell classification and processing pipeline for the iScience manuscript 'Divergent DNA Damage and Morphological Responses of Immune Cells to High-LET Radiation'"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "umap-learn>=0.5",
    "tifffile>=2023.7.10",
    "scikit-image>=0.21",
    "openpyxl>=3.1",
    "jupyter>=1.0",
]

[project.optional-dependencies]
cellpose = ["cellpose>=2.2"]

[tool.uv]
# This is a notebooks-only repository (no Python package to build).
# `uv sync` installs the dependencies above into a .venv without building the project itself.
package = false
